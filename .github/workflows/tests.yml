name: MailProcessor tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Windows Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: python -m ruff check .

      - name: Diagnose Windows pytest process shutdown
        shell: pwsh
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          Write-Output "DIAGNOSTIC_START: Windows pytest process"
          python -c 'import importlib.metadata as m, sys; print("PYTHON_VERSION="+sys.version.split()[0]); print("PYTEST_VERSION="+m.version("pytest")); print("PYSIDE6_VERSION="+m.version("PySide6")); print("SHIBOKEN6_VERSION="+m.version("shiboken6"))'
          $versionExitCode = $LASTEXITCODE
          Write-Output "VERSION_PROBE_PROCESS_EXIT_CODE=$versionExitCode"
          if ($versionExitCode -ne 0) {
            Write-Output "DIAGNOSTIC_END: version probe failed"
            exit $versionExitCode
          }
          Write-Output "PYTEST_PROCESS_START"
          python -X faulthandler -m pytest -q
          $pytestExitCode = $LASTEXITCODE
          Write-Output "PYTEST_PROCESS_EXIT_CODE=$pytestExitCode"
          Write-Output "PYTEST_PROCESS_END"
          if ($pytestExitCode -ne 0 -and $env:PYTHON_VERSION -in @('3.10', '3.11')) {
            Write-Output "MODULE_DIAGNOSIS_START=full-suite-exit-$pytestExitCode"
            $moduleFailures = @()
            $testFiles = @(Get-ChildItem tests -Filter 'test_*.py' -File | Sort-Object Name)
            foreach ($testFile in $testFiles) {
              $relativePath = "tests/$($testFile.Name)"
              Write-Output "MODULE_CHILD_START=$relativePath"
              python -X faulthandler -m pytest -q $relativePath
              $moduleExitCode = $LASTEXITCODE
              Write-Output "MODULE_CHILD_EXIT_CODE=${relativePath}:$moduleExitCode"
              if ($moduleExitCode -ne 0) {
                $moduleFailures += "$relativePath=$moduleExitCode"
              }
            }
            Write-Output "MODULE_CHILD_COUNT=$($testFiles.Count)"
            if ($moduleFailures.Count -eq 0) {
              Write-Output "MODULE_DIAGNOSIS_ALL_CHILDREN_EXITED_0; FULL_SUITE_REMAINS_FAILED=$pytestExitCode"
            } else {
              Write-Output "MODULE_DIAGNOSIS_FAILURES=$($moduleFailures -join '; ')"
              Write-Output "FULL_SUITE_REMAINS_FAILED=$pytestExitCode"
            }
            Write-Output "MODULE_DIAGNOSIS_END"
          }
          Write-Output "DIAGNOSTIC_END"
          exit $pytestExitCode

      - name: Compile Python sources
        env:
          PYTHONIOENCODING: utf-8
        run: python -m compileall .

  source-smoke:
    name: Source-Platform Smoke (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run standalone source-platform smoke
        env:
          PYTHONIOENCODING: utf-8
        run: python tests/source_platform_smoke.py

      - name: Run contract test
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q tests/test_source_platform_smoke_contract.py
