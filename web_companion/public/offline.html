<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MailProcessor — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #f9fafb;
      color: #1f2937;
    }
    .box { text-align: center; padding: 2rem; max-width: 400px; }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { color: #6b7280; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #1E78C8;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #1660a8; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Keine Verbindung</h1>
    <p>MailProcessor Companion ist im Offline-Modus nicht verfügbar. Bitte stellen Sie eine Internetverbindung her und laden Sie die Seite neu.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </div>
</body>
</html>
