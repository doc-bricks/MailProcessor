<!doctype html>
<html lang="de">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#1E78C8">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

        });

</html>
